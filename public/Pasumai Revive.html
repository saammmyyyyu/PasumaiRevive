*,
*::before,
*::after {
  box-sizing: border-box;
}
html {
  scroll-behavior: smooth;
  scroll-padding-top: 90px;
}
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font:
    15px/1.62 Inter,
    "Noto Sans Tamil",
    system-ui,
    sans-serif;
}
body:has(dialog[open]) {
  overflow: hidden;
}
button,
input,
textarea,
select {
  font: inherit;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.58;
}
a {
  color: inherit;
  text-decoration: none;
}
button,
a,
input,
textarea,
select,
summary {
  outline-offset: 4px;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible,
summary:focus-visible {
  outline: 2px solid var(--leaf);
}
img {
  display: block;
  max-width: 100%;
}
h1,
h2,
h3,
h4,
p,
figure {
  margin: 0;
}
h1,
h2,
h3,
h4 {
  line-height: 1.14;
  letter-spacing: -0.035em;
}
p,
small {
  color: var(--muted);
}
em {
  font-family: Georgia, serif;
  font-weight: 400;
  color: var(--green);
  letter-spacing: -0.055em;
}
:lang(ta) em {
  font-family: inherit;
  letter-spacing: 0;
}
:lang(ta) h1,
:lang(ta) h2,
:lang(ta) h3 {
  letter-spacing: 0;
  line-height: 1.38;
}
h2 {
  font-size: clamp(32px, 4vw, 50px);
  font-weight: 750;
}
h3 {
  font-size: 21px;
}
small {
  font-size: 12px;
}
svg.ico {
  width: 20px;
  height: 20px;
  flex: none;
  vertical-align: middle;
}
.wrap {
  max-width: 1280px;
  padding-inline: 42px;
  margin-inline: auto;
}
.section {
  padding-block: 88px;
}
.section-head {
  display: grid;
  gap: 11px;
  margin-bottom: 28px;
  max-width: 670px;
}
.section-head p {
  max-width: 620px;
}
.center {
  margin-inline: auto;
  text-align: center;
}
.center .eyebrow {
  justify-content: center;
}
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.145em;
  text-transform: uppercase;
  color: var(--green);
}
.eyebrow .ico {
  width: 15px;
  height: 15px;
}
.eyebrow .dot,
.dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--leaf);
  flex: none;
}
.btn,
.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  border: 1px solid transparent;
  border-radius: 10px;
  font-weight: 650;
  line-height: 1.22;
  min-height: 44px;
  padding: 11px 17px;
  background: var(--forest);
  color: white;
  transition:
    background 0.18s,
    transform 0.18s,
    border-color 0.18s;
  text-align: center;
}
.btn:hover:not(:disabled),
.icon-btn:hover:not(:disabled) {
  transform: translateY(-1px);
  background: var(--deep);
}
.btn.secondary,
.icon-btn {
  background: white;
  color: var(--forest);
  border-color: var(--line);
}
.btn.secondary:hover:not(:disabled),
.icon-btn:hover:not(:disabled) {
  background: var(--sage);
  border-color: #b7cdb9;
}
.btn.ghost {
  background: transparent;
  color: var(--forest);
  border-color: transparent;
}
.btn.ghost:hover {
  background: var(--sage);
}
.btn.light {
  background: #edf6e4;
  color: var(--deep);
}
.btn.light:hover {
  background: #fff;
}
.btn.warn {
  background: var(--terra);
}
.btn.small {
  min-height: 38px;
  padding: 8px 12px;
  font-size: 12px;
}
.btn .ico,
.icon-btn .ico {
  width: 17px;
  height: 17px;
}
.icon-btn {
  width: 44px;
  flex: none;
  padding: 0;
}
.text-btn {
  padding: 0;
  border: 0;
  background: none;
  color: var(--green);
  font-weight: 700;
  text-align: left;
  line-height: 1.4;
}
.text-btn:hover {
  text-decoration: underline;
}
.row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.spread {
  justify-content: space-between;
}
.stack {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  align-content: start;
  min-width: 0;
}
.grid {
  display: grid;
  gap: 16px;
  min-width: 0;
}
.g2 {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.g3 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.g4 {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}
.card {
  background: white;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px;
  min-width: 0;
}
.card p + p {
  margin-top: 8px;
}
.card-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.card-head p {
  font-size: 13px;
  margin-top: 4px;
}
.symbol {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  flex: none;
  border-radius: 12px;
  background: var(--sage);
  color: var(--green);
}
.symbol .ico {
  width: 21px;
  height: 21px;
}
.symbol.earth {
  background: #f9ebe1;
  color: var(--terra);
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 99px;
  padding: 5px 9px;
  font-size: 11px;
  font-weight: 750;
  line-height: 1.25;
  background: #eef1eb;
  color: #435c4d;
  white-space: normal;
}
.badge.green {
  background: #e5f3e7;
  color: #266245;
}
.badge.amber {
  background: #fff0d7;
  color: #805014;
}
.badge.red {
  background: #fbe9e3;
  color: #973f2d;
}
.muted {
  color: var(--muted);
}
.soft {
  background: #eef3eb;
}
.mono {
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.03em;
}
.details {
  display: grid;
  gap: 0;
  margin: 0;
}
.details > div {
  display: grid;
  grid-template-columns: minmax(105px, 1fr) minmax(0, 1.3fr);
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
}
.details dt {
  color: var(--muted);
}
.details dd {
  margin: 0;
  font-weight: 650;
  overflow-wrap: anywhere;
}
.details > div:last-child {
  border: 0;
}
.notice {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 11px 13px;
  border-radius: 10px;
  color: var(--forest);
  background: var(--sage);
  font-size: 13px;
}
.notice.amber {
  background: #fff0dc;
  color: #764919;
}
.notice span {
  min-width: 0;
  overflow-wrap: anywhere;
}
.notice .ico {
  width: 17px;
  height: 17px;
  margin-top: 2px;
}
.empty {
  border: 1px dashed var(--line);
  border-radius: 12px;
  text-align: center;
  padding: 21px;
  color: var(--muted);
}
.jump {
  position: absolute;
  left: 12px;
  top: -100px;
  background: white;
  padding: 8px;
  z-index: 50;
}
.jump:focus {
  top: 8px;
}
/* Public site */
.site-head {
  background: #fafbf7f5;
  backdrop-filter: blur(14px);
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid #e3e8df;
}
.head-inner {
  min-height: 74px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 18px;
  align-items: center;
}
.brand {
  display: inline-flex;
  gap: 11px;
  align-items: center;
  justify-self: start;
  line-height: 1.04;
  color: var(--deep);
  white-space: nowrap;
}
.brand-mark {
  display: grid;
  place-items: center;
  background: var(--forest);
  color: #eaf5dc;
  border-radius: 11px;
  width: 41px;
  height: 41px;
}
.brand-mark .ico {
  width: 25px;
  height: 25px;
}
.brand strong {
  display: block;
  font-size: 18px;
  letter-spacing: -0.055em;
}
.brand small {
  display: block;
  font-size: 9px;
  letter-spacing: 0.14em;
  font-weight: 750;
  text-transform: uppercase;
  margin-top: 5px;
  color: var(--green);
}
.primary-nav {
  display: flex;
  align-items: center;
  gap: 27px;
}
.primary-nav a {
  font-weight: 600;
  font-size: 13px;
  color: #48584e;
  position: relative;
  white-space: nowrap;
}
.primary-nav a:hover,
.primary-nav a.active {
  color: var(--forest);
}
.primary-nav a.active::after {
  content: "";
  position: absolute;
  bottom: -9px;
  left: 0;
  width: 18px;
  height: 2px;
  border-radius: 2px;
  background: var(--leaf);
}
.head-actions {
  justify-self: end;
  display: flex;
  gap: 9px;
  align-items: center;
}
.lang {
  font-size: 12px;
}
.menu-btn {
  display: none;
}
.hero {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  background: radial-gradient(ellipse at 70% 45%, #ecf2e5 0%, transparent 65%), #f7f8f2;
}
.hero::before {
  content: "";
  position: absolute;
  z-index: -1;
  right: -7vw;
  top: -290px;
  width: 770px;
  height: 770px;
  border-radius: 50%;
  border: 1px solid #d8e4d3;
  box-shadow:
    0 0 0 40px #dae7d346,
    0 0 0 82px #dae7d322,
    0 0 0 125px #dae7d31a;
}
.hero-grid {
  display: grid;
  grid-template-columns: 1fr 1.03fr;
  gap: 43px;
  align-items: center;
  padding-block: 54px 48px;
}
.hero-copy {
  display: grid;
  justify-items: start;
  gap: 21px;
  min-width: 0;
}
.hero-copy h1 {
  font-size: clamp(42px, 4.15vw, 61px);
  line-height: 1.035;
  letter-spacing: -0.078em;
  color: #153325;
  font-weight: 750;
}
.hero-copy h1 em {
  display: block;
}
.hero-copy p {
  max-width: 480px;
  font-size: 16px;
  line-height: 1.72;
}
.hero-copy .row {
  gap: 11px;
}
.hero-copy .btn {
  min-height: 48px;
}
.hero-copy .eyebrow {
  border: 1px solid #dbe7d8;
  background: #eff5e9;
  padding: 7px 11px;
  border-radius: 99px;
  letter-spacing: 0.1em;
}
.hero-tags {
  padding-top: 5px;
  display: flex;
  gap: 13px 19px;
  flex-wrap: wrap;
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
}
.hero-tags span {
  display: flex;
  gap: 7px;
  align-items: center;
}
.hero-tags .ico {
  width: 15px;
  height: 15px;
  color: var(--green);
}
.hero-photo {
  position: relative;
  isolation: isolate;
  min-height: 440px;
  border-radius: 23px;
  overflow: hidden;
  box-shadow: 0 22px 45px #1a35252e;
  background: #31533b var(--hero) center/cover no-repeat;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 17px;
}
.hero-photo::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: 0;
  background: linear-gradient(180deg, #132a2440, transparent 36%, transparent 55%, #10251ac7);
}
.photo-pill {
  align-self: flex-start;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 7px 10px;
  background: #fbfff1ed;
  color: var(--deep);
  border-radius: 99px;
  font-size: 11px;
  font-weight: 750;
}
.photo-pill .ico {
  width: 14px;
  height: 14px;
}
.photo-panel {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 11px;
  align-items: center;
  padding: 12px;
  border: 1px solid #ffffff44;
  background: #132d22cc;
  backdrop-filter: blur(10px);
  border-radius: 13px;
  color: white;
}
.photo-panel .symbol {
  background: #e4efcf;
  color: var(--forest);
  width: 37px;
  height: 37px;
  border-radius: 9px;
}
.photo-panel b,
.photo-panel small {
  display: block;
  line-height: 1.35;
}
.photo-panel small {
  color: #ddeadd;
  font-size: 11px;
  margin-top: 2px;
}
.photo-panel .badge {
  background: #d8edbd;
  color: #274632;
}
.metrics-wrap {
  padding-bottom: 39px;
}
.metrics {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  background: #ffffffdc;
  border: 1px solid var(--line);
  border-radius: 17px;
  box-shadow: 0 8px 28px #193c2209;
}
.metric {
  display: flex;
  min-width: 0;
  gap: 12px;
  align-items: center;
  padding: 18px 19px;
}
.metric + .metric {
  border-left: 1px solid var(--line);
}
.metric b,
.metric small {
  display: block;
}
.metric b {
  font-size: 24px;
  line-height: 1.12;
  letter-spacing: -0.045em;
  color: var(--deep);
}
.metric small {
  line-height: 1.28;
  margin-top: 4px;
}
.metrics-note {
  margin-top: 8px;
  text-align: right;
  font-size: 11px;
  color: var(--muted);
}
.process {
  background: #fff;
  border-block: 1px solid var(--line);
  padding-block: 64px 75px;
}
.process .section-head {
  margin-bottom: 28px;
}
.stage-btn {
  display: grid;
  gap: 10px;
  text-align: left;
  width: 100%;
  border: 1px solid var(--line);
  transition: 0.18s;
  background: white;
  color: inherit;
}
.stage-btn:hover {
  border-color: var(--leaf);
  transform: translateY(-2px);
}
.stage-btn[aria-pressed="true"] {
  background: #eff6ec;
  border-color: #8aae92;
  box-shadow: inset 0 0 0 1px #b9d4bd;
}
.stage-num {
  color: var(--green);
  font-size: 11px;
  font-weight: 750;
  letter-spacing: 0.1em;
}
.stage-detail {
  background: var(--deep);
  border-radius: var(--radius);
  color: white;
  padding: 25px;
  margin-top: 13px;
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: 24px;
}
.stage-detail p,
.stage-detail dt {
  color: #d0dfd3;
}
.stage-detail h3 {
  margin-bottom: 9px;
}
.stage-detail .details > div {
  border-color: #ffffff30;
}
.stage-detail .eyebrow {
  color: #d5edbf;
  margin-bottom: 8px;
}
.impact-grid {
  grid-template-columns: 0.9fr 1.1fr;
}
.role-card {
  display: grid;
  gap: 12px;
  align-content: start;
}
.role-card p {
  min-height: 46px;
}
.role-card .btn {
  justify-self: start;
}
.callout {
  background: var(--deep);
  background-image: radial-gradient(ellipse at 85% 40%, #2d6044, transparent 65%);
  padding: 37px 40px;
  border-radius: 24px;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
}
.callout p,
.callout .eyebrow {
  color: #d7e9d3;
}
.callout h2 {
  font-size: clamp(26px, 3.8vw, 42px);
  margin: 7px 0;
}
.site-foot {
  background: #102f23;
  color: #eaf6e8;
  padding: 42px 0 22px;
  margin-top: 0;
}
.site-foot p,
.site-foot small,
.site-foot .brand small {
  color: #bdcebf;
}
.site-foot .brand {
  color: white;
}
.site-foot .brand-mark {
  background: #315840;
}
.foot-grid {
  display: grid;
  grid-template-columns: 1.55fr 1fr 1fr;
  gap: 26px;
}
.foot-grid > div {
  display: grid;
  gap: 9px;
  align-content: start;
}
.foot-bottom {
  margin-top: 26px;
  border-top: 1px solid #ffffff25;
  padding-top: 16px;
}
.foot-grid a:hover,
.foot-bottom a:hover {
  text-decoration: underline;
}
.page-intro {
  padding-block: 64px 44px;
  background: #edf3e9;
  border-bottom: 1px solid var(--line);
}
.page-intro h1 {
  font-size: clamp(37px, 5.5vw, 67px);
  max-width: 890px;
  margin: 7px 0 12px;
}
.page-intro p {
  max-width: 720px;
}
.about-img {
  min-height: 330px;
  background: #416a50 var(--hero) center/cover;
  border-radius: 20px;
  display: flex;
  align-items: end;
  padding: 17px;
}
.about-img small {
  color: white;
  background: #123023db;
  border-radius: 9px;
  padding: 7px 9px;
}
.faq {
  display: grid;
  gap: 8px;
}
.faq details {
  border: 1px solid var(--line);
  background: white;
  border-radius: 12px;
  padding: 12px 15px;
}
.faq summary {
  cursor: pointer;
  font-weight: 650;
}
.faq p {
  margin-top: 8px;
}
.lang-logo {
  width: 108px;
  border-radius: 7px;
  background: white;
  padding: 4px;
}
/* Dashboard, reports and forms */
.dash {
  display: grid;
  grid-template-columns: 225px minmax(0, 1fr);
  min-height: 100vh;
}
.dash.collapsed {
  grid-template-columns: 66px minmax(0, 1fr);
}
.sidebar {
  position: sticky;
  top: 0;
  height: 100dvh;
  overflow: auto;
  background: var(--deep);
  color: white;
  padding: 17px 10px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}
.sidebar .brand {
  color: white;
  padding: 0 6px;
}
.sidebar .brand small {
  color: #c8dbcc;
}
.sidebar .brand-mark {
  background: #2d5943;
}
.sidebar nav {
  display: grid;
  gap: 3px;
}
.side-link {
  display: flex;
  gap: 9px;
  align-items: center;
  line-height: 1.3;
  min-height: 40px;
  background: none;
  border: 1px solid transparent;
  color: #d8e6d9;
  font-size: 13px;
  font-weight: 600;
  border-radius: 8px;
  padding: 7px 9px;
  text-align: left;
  width: 100%;
}
.side-link:hover,
.side-link[aria-current="page"] {
  background: #315a44;
  color: white;
}
.side-link[aria-current="page"] {
  border-color: #65816d;
}
.side-link .ico {
  width: 17px;
  height: 17px;
}
.collapsed .sidebar .sx {
  display: none;
}
.collapsed .sidebar .side-link {
  justify-content: center;
}
.sidebar-bottom {
  margin-top: auto;
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: #fafbf7f5;
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
  min-height: 67px;
  padding: 9px 20px;
}
.topbar .row {
  flex-wrap: nowrap;
}
.topbar .icon-btn {
  position: relative;
}
.bell-dot {
  position: absolute;
  top: 7px;
  right: 7px;
  background: #b44f24;
  width: 7px;
  height: 7px;
  border-radius: 50%;
}
.avatar {
  display: grid;
  place-items: center;
  border-radius: 50%;
  height: 29px;
  width: 29px;
  background: var(--sage);
  color: var(--forest);
  font-weight: 750;
  font-size: 11px;
  flex: none;
}
.dash-content {
  max-width: 1320px;
  margin-inline: auto;
  padding: 26px 24px 50px;
  display: grid;
  gap: 19px;
  min-width: 0;
}
.dash-title h1 {
  font-size: clamp(27px, 4.2vw, 42px);
  margin: 5px 0;
}
.dash-title p {
  font-size: 14px;
}
.dash-intro {
  background: linear-gradient(115deg, #153b2a, #32634a);
  color: white;
  border-radius: 18px;
  padding: 22px 24px;
}
.dash-intro p,
.dash-intro .eyebrow {
  color: #d7e8d9;
}
.dash-intro .badge {
  background: #e7f4dd;
  color: var(--forest);
}
.dash-stat {
  display: grid;
  gap: 6px;
  padding: 15px;
  align-content: start;
}
.dash-stat b {
  font-size: 25px;
  color: var(--deep);
  letter-spacing: -0.04em;
  line-height: 1.12;
  overflow-wrap: anywhere;
}
.dash-stat .symbol {
  width: 36px;
  height: 36px;
}
.dash-stat .symbol .ico {
  width: 17px;
  height: 17px;
}
.dash-stat small {
  line-height: 1.25;
}
.chart-box {
  height: 225px;
  position: relative;
  min-width: 0;
}
.chart-box.short {
  height: 188px;
}
.chart-alt {
  font-size: 12px;
  margin-top: 7px;
}
.table-scroll {
  width: 100%;
  min-width: 0;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 11px;
}
.table-scroll:focus-visible {
  outline: 2px solid var(--leaf);
}
table {
  width: max-content;
  min-width: 100%;
  border-collapse: collapse;
  background: white;
  text-align: left;
  font-size: 13px;
}
thead {
  background: #eff4ed;
  color: var(--forest);
}
th,
td {
  padding: 10px 11px;
  border-bottom: 1px solid var(--line);
  overflow-wrap: anywhere;
}
th {
  font-size: 11px;
  white-space: nowrap;
}
td {
  min-width: 62px;
  max-width: 340px;
}
tr:last-child td {
  border-bottom: 0;
}
tbody tr:hover {
  background: #f8faf6;
}
.tray {
  display: grid;
  gap: 9px;
}
.record {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 11px;
}
.record b {
  display: block;
  line-height: 1.25;
}
.record p {
  font-size: 12px;
  margin-top: 3px;
  overflow-wrap: anywhere;
}
.selection,
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}
.chip {
  border: 1px solid var(--line);
  color: var(--forest);
  background: white;
  padding: 7px 10px;
  min-height: 37px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 650;
}
.chip:hover,
.chip[aria-pressed="true"] {
  background: #e2efdf;
  border-color: #9cbba1;
}
.progress {
  height: 8px;
  border-radius: 99px;
  background: #e7eee5;
  overflow: hidden;
}
.progress b {
  display: block;
  height: 100%;
  background: var(--leaf);
  border-radius: 99px;
}
.ring {
  display: grid;
  place-items: center;
  flex: none;
  width: 84px;
  height: 84px;
  border-radius: 50%;
  background: conic-gradient(var(--leaf) var(--pct), #e7eee5 0);
}
.ring b {
  background: white;
  width: 68px;
  height: 68px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 17px;
}
.mobile-bottom {
  display: none;
}
.mobile-dash-menu {
  display: none;
}
.guide-list {
  display: grid;
  gap: 7px;
  margin-top: 12px;
}
.guide-list span {
  display: flex;
  gap: 9px;
  align-items: start;
}
.guide-list .ico {
  width: 16px;
  height: 16px;
  margin-top: 4px;
  color: var(--green);
}
.guide-list.no .ico {
  color: var(--terra);
}
form {
  display: grid;
  gap: 13px;
  min-width: 0;
}
.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.field {
  display: grid;
  gap: 5px;
  align-content: start;
  min-width: 0;
}
.field.wide {
  grid-column: 1/-1;
}
.field label,
.label {
  font-size: 12px;
  font-weight: 700;
  color: var(--ink);
}
input:not([type="checkbox"]):not([type="radio"]),
select,
textarea {
  width: 100%;
  min-width: 0;
  border: 1px solid #cad6c9;
  border-radius: 9px;
  padding: 9px 10px;
  background: white;
  color: var(--ink);
  min-height: 42px;
  font-size: 14px;
}
textarea {
  resize: vertical;
  min-height: 86px;
}
input[type="checkbox"],
input[type="radio"],
input[type="range"] {
  accent-color: var(--green);
}
input[type="range"] {
  padding: 0 !important;
  min-height: 30px !important;
  border: 0 !important;
}
.check {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 13px;
  cursor: pointer;
}
.check input {
  margin-top: 4px;
}
.field-error,
.form-error {
  font-size: 12px;
  color: #9b3925;
  font-weight: 600;
}
.field-error:empty,
.form-error:empty {
  display: none;
}
[aria-invalid="true"] {
  border-color: #bd5c47 !important;
}
.password-wrap {
  display: flex;
  gap: 5px;
}
.password-wrap .icon-btn {
  min-height: 42px;
}
.inline-filter {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: end;
}
.inline-filter .field {
  flex: 1 1 125px;
  max-width: 250px;
}
.inline-filter .btn {
  min-height: 42px;
}
.grade-picker {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}
.grade-picker label {
  display: flex;
  gap: 5px;
  align-items: center;
  padding: 8px 10px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--paper);
  cursor: pointer;
}
.grade-picker label:has(input:checked) {
  border-color: var(--leaf);
  background: var(--sage);
}
.grade-picker label.amber:has(input:checked) {
  background: #fff0d7;
  border-color: #a9722c;
}
.grade-picker label.red:has(input:checked) {
  background: #fbe9e3;
  border-color: #ad513d;
}
.receipt {
  background: #e8efe6;
  border-radius: 13px;
  padding: 13px;
}
.receipt .details {
  background: white;
  padding: 8px 13px;
  border-radius: 9px;
}
.sim-result {
  background: #edf5e9;
}
.sim-result .dash-stat {
  box-shadow: none;
}
.sim-result .chart-box {
  height: 180px;
}
.filter-tabs {
  margin-bottom: 12px;
}
.scan-frame {
  display: grid;
  place-items: center;
  min-height: 130px;
  background: #edf4eb;
  border: 1px dashed #87ac91;
  border-radius: 12px;
  color: var(--green);
}
.scan-frame .ico {
  width: 65px;
  height: 65px;
  stroke-width: 1.3;
}
.report-print {
  display: none;
}
/* Dialog, reveal and responsive layouts */
dialog {
  border: 1px solid var(--line);
  border-radius: 20px;
  width: min(94vw, 580px);
  max-height: min(90dvh, 850px);
  color: var(--ink);
  background: white;
  padding: 0;
  box-shadow: 0 25px 80px #112b2455;
}
dialog::backdrop {
  background: #13282099;
  backdrop-filter: blur(3px);
}
dialog[open] {
  animation: pop 0.22s ease both;
}
.dialog-inner {
  display: grid;
  gap: 14px;
  padding: 21px;
}
.dialog-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: flex-start;
}
.dialog-head h2 {
  font-size: 26px;
  margin: 4px 0;
}
.dialog-head .icon-btn {
  height: 38px;
  width: 38px;
  min-height: 38px;
}
.role-picker {
  gap: 7px;
}
.role-picker button {
  display: grid;
  justify-items: start;
  gap: 5px;
  font-size: 11px;
  padding: 9px;
}
.role-picker .ico {
  width: 17px;
  height: 17px;
}
.success {
  display: grid;
  justify-items: center;
  gap: 12px;
  text-align: center;
  padding: 20px 0 10px;
}
.success .symbol {
  width: 62px;
  height: 62px;
  animation: pop 0.35s both;
}
.toast {
  position: fixed;
  z-index: 40;
  right: 14px;
  bottom: 15px;
  padding: 12px 16px;
  max-width: min(90vw, 390px);
  border-radius: 12px;
  color: white;
  background: var(--deep);
  box-shadow: var(--shadow);
  font-size: 14px;
  transform: translateY(140%);
  opacity: 0;
  transition: 0.22s;
  pointer-events: none;
}
.toast.show {
  transform: none;
  opacity: 1;
}
.drawer {
  margin: 0 0 0 auto;
  height: 100dvh;
  max-height: none;
  width: min(90vw, 345px);
  border-radius: 16px 0 0 16px;
  border-block: 0;
  border-right: 0;
}
.drawer nav {
  display: grid;
  gap: 7px;
}
.drawer .side-link {
  color: var(--forest);
}
.drawer .side-link:hover,
.drawer .side-link[aria-current="page"] {
  background: var(--sage);
}
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
[hidden] {
  display: none !important;
}
.reveal {
  transition:
    opacity 0.45s,
    transform 0.45s;
}
.reveal.pre {
  opacity: 0;
  transform: translateY(13px);
}
@keyframes pop {
  from {
    opacity: 0;
    transform: translateY(7px) scale(0.985);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@media (max-width: 1050px) {
  .wrap {
    padding-inline: 28px;
  }
  .primary-nav {
    gap: 16px;
  }
  .hero-grid {
    gap: 25px;
  }
  .hero-photo {
    min-height: 410px;
  }
  .metric {
    padding: 15px 12px;
    gap: 8px;
  }
  .metric .symbol {
    height: 36px;
    width: 36px;
  }
  .metric b {
    font-size: 21px;
  }
  .dash {
    grid-template-columns: 190px minmax(0, 1fr);
  }
  .dash-content {
    padding-inline: 17px;
  }
  .dash-stat .row {
    gap: 5px;
  }
}
.site-head + main {
  min-width: 0;
}
html[lang="ta"] .hero-copy h1 {
  line-height: 1.3;
  letter-spacing: 0;
  font-size: clamp(31px, 3.8vw, 53px);
}
@media (max-width: 960px) {
  .head-inner {
    grid-template-columns: 1fr auto;
  }
  .primary-nav {
    display: none;
  }
  .menu-btn {
    display: inline-flex;
  }
}
@media (max-width: 830px) {
  .head-inner {
    grid-template-columns: 1fr auto;
    min-height: 64px;
  }
  .primary-nav {
    display: none;
  }
  .menu-btn {
    display: inline-flex;
  }
  .hero-grid {
    padding-block: 38px 32px;
  }
  .hero-photo {
    min-height: 350px;
  }
  .hero-copy {
    gap: 16px;
  }
  .hero-copy h1 {
    font-size: clamp(36px, 5.5vw, 49px);
  }
  .hero-copy p {
    font-size: 14px;
  }
  .section {
    padding-block: 59px;
  }
  .metrics {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .metric:nth-child(3) {
    border-left: 0;
  }
  .metric:nth-child(n + 3) {
    border-top: 1px solid var(--line);
  }
  .dash,
  .dash.collapsed {
    grid-template-columns: minmax(0, 1fr);
  }
  .sidebar,
  .desktop-collapse {
    display: none;
  }
  .mobile-dash-menu {
    display: inline-flex;
  }
  .mobile-bottom {
    display: flex;
    justify-content: space-around;
    gap: 2px;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 7;
    background: white;
    border-top: 1px solid var(--line);
    padding: 5px 4px calc(env(safe-area-inset-bottom, 0px) + 5px);
  }
  .mobile-bottom .side-link {
    width: auto;
    flex: 1;
    justify-content: center;
    flex-direction: column;
    gap: 3px;
    color: var(--forest);
    text-align: center;
    font-size: 10px;
    min-height: 43px;
    padding: 4px;
  }
  .mobile-bottom .side-link[aria-current="page"] {
    background: var(--sage);
  }
  .dash-content {
    padding-bottom: 92px;
  }
  .toast {
    bottom: 67px;
  }
}
@media (max-width: 620px) {
  .wrap {
    padding-inline: 16px;
  }
  .head-inner {
    gap: 7px;
  }
  .head-actions {
    gap: 4px;
  }
  .head-actions .btn {
    padding: 8px;
    min-height: 40px;
  }
  .head-actions .icon-btn {
    min-height: 40px;
    width: 38px;
  }
  .head-actions .auth-text {
    display: none;
  }
  .brand {
    gap: 8px;
  }
  .brand-mark {
    width: 37px;
    height: 37px;
  }
  .brand strong {
    font-size: 16px;
  }
  .brand small {
    font-size: 8px;
  }
  .hero-grid {
    grid-template-columns: minmax(0, 1fr);
    gap: 24px;
    padding-block: 28px 20px;
  }
  .hero-copy h1 {
    font-size: clamp(37px, 9.9vw, 52px);
    max-width: 530px;
  }
  .hero-copy .btn {
    font-size: 13px;
    min-height: 44px;
    padding-inline: 11px;
  }
  .hero-photo {
    min-height: 0;
    aspect-ratio: 1.3;
    padding: 11px;
  }
  .photo-panel {
    padding: 8px;
    gap: 7px;
  }
  .photo-panel b {
    font-size: 13px;
  }
  .photo-panel .badge {
    font-size: 9px;
  }
  .metric {
    padding: 11px 8px;
  }
  .metric .symbol {
    width: 32px;
    height: 32px;
    border-radius: 8px;
  }
  .metric .symbol .ico {
    width: 16px;
    height: 16px;
  }
  .metric b {
    font-size: 18px;
  }
  .metric small {
    font-size: 11px;
  }
  .metrics-wrap {
    padding-bottom: 25px;
  }
  .section,
  .process {
    padding-block: 45px;
  }
  .g3,
  .g2,
  .impact-grid,
  .stage-detail,
  .foot-grid {
    grid-template-columns: minmax(0, 1fr);
  }
  .stage-btn {
    padding: 12px;
    gap: 4px;
  }
  .stage-btn p {
    font-size: 13px;
  }
  .stage-btn .symbol {
    height: 34px;
    width: 34px;
  }
  .stage-detail,
  .card {
    padding: 15px;
  }
  .g4 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .callout {
    padding: 22px;
    align-items: flex-start;
    flex-direction: column;
  }
  .page-intro {
    padding-block: 40px 28px;
  }
  .role-picker {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .role-card p {
    min-height: 0;
  }
  .topbar {
    padding: 7px 9px;
  }
  .topbar .row {
    gap: 4px;
  }
  .topbar .icon-btn {
    width: 38px;
    min-height: 38px;
  }
  .topbar .profile-text,
  .topbar .desk-only {
    display: none;
  }
  .dash-content {
    padding-inline: 10px;
    gap: 13px;
  }
  .dash-intro {
    padding: 16px;
  }
  .dash-stat b {
    font-size: 20px;
  }
  .form-grid {
    grid-template-columns: minmax(0, 1fr);
  }
  .chart-box {
    height: 190px;
  }
  .dialog-inner {
    padding: 15px;
  }
  .details > div {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
  }
}
@media (max-width: 365px) {
  .site-head .head-inner {
    padding-inline: 10px;
  }
  .head-actions .lang .ico {
    display: none;
  }
  .head-actions .lang {
    padding-inline: 6px;
  }
  .head-actions .icon-btn {
    width: 34px;
  }
  .brand-mark {
    width: 32px;
    height: 32px;
  }
  .brand strong {
    font-size: 15px;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation: none !important;
    transition: none !important;
  }
  .reveal.pre {
    opacity: 1;
    transform: none;
  }
}
@media print {
  body > * {
    display: none !important;
  }
  body .report-print {
    display: block !important;
    background: white;
    color: black;
    padding: 10px;
  }
  .report-print table {
    font-size: 10px;
  }
  .report-print h1 {
    margin-bottom: 15px;
  }
}

const chartData = (rows, mode = "day", from = "", to = "") => {

      let x = new Date(d + "T12:00:00");
      x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
      return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`;
    }
    return d;
  };
  if (mode === "day" && !from && !to) for (let i = -6; i <= 0; i++) buckets.set(dateISO(i), 0);
  for (const r of rows) buckets.set(k(r.date), num((buckets.get(k(r.date)) || 0) + r.weight));
  const keys = [...buckets.keys()].sort(),
    fmt = new Intl.DateTimeFormat(
      t("en-IN", "ta-IN"),

const csvSafe = (v) => {
  const s = String(v ?? "");
  return (
    '"' +
    (typeof v === "string" && /^[\s]*[=+\-@\t\r]/.test(s) ? "'" : "") +
    s.replaceAll('"', '""') +
    '"'
  );
};
function csv(name, cols, rows) {
  const url = URL.createObjectURL(
    new Blob(["\ufeff" + [cols, ...rows].map((row) => row.map(csvSafe).join(",")).join("\r\n")], {
      type: "text/csv;charset=utf-8",
    }),
  );
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(t("CSV download ready.", "CSV பதிவிறக்கம் தயார்."));
}

          existingOrders.filter((o) => o.status === "Pending"),
          "quantity",
        )
      )
        return err(
          f,
          "stock",
          t(
            "Stock cannot fall below pending reservations.",
            "கையிருப்பு நிலுவை ஒதுக்கீட்டை விடக் குறையக் கூடாது.",
          ),
        );
      if (num((v.stock + distributed) * v.bag + inventoryMass(v.batch, id)) > b.finished)
        return err(
          f,
          "stock",
          t(
            "Inventory and delivered bags exceed validated batch output.",
            "கையிருப்பும் வழங்கிய பைகளும் சரிபார்த்த தொகுதி வெளியீட்டை மீறுகின்றன.",
          ),
        );
      upsert(db.products, v, id, "PRD");
      break;
    }
    case "order": {
      const p = pick(db.products, v.product),
        old = pick(db.orders, id);
      if (!p)
        return err(
          f,
          "product",
          t("Select an inventory item.", "கையிருப்புப் பொருளைத் தேர்ந்தெடுக்கவும்."),
        );
      if (old?.status === "Delivered")
        return err(f, "status", t("Delivered orders are final.", "வழங்கிய ஆர்டர்கள் இறுதியானவை."));
      numberFields(v, "quantity");
      const reserved = sum(
        db.orders.filter((o) => o.id !== id && o.product === p.id && o.status === "Pending"),
        "quantity",
      );
      if (v.status !== "Cancelled" && v.quantity > p.stock - reserved)
        return err(
          f,
          "quantity",
          t("Quantity exceeds unreserved stock.", "அளவு ஒதுக்காத கையிருப்பை விட அதிகம்."),
        );
      if (v.status === "Delivered") p.stock -= v.quantity;
      upsert(db.orders, { ...v, price: old?.product === p.id ? old.price : p.price }, id, "ORD");
      break;
    }
    case "subscription":
      if (!pick(db.shops, v.shop))
        return err(f, "shop", t("Choose a registered shop.", "பதிவு செய்த கடையைத் தேர்ந்தெடுக்கவும்."));
      if (
        db.subscriptions.some(
          (x) => x.id !== id && x.shop === v.shop && x.date.slice(0, 7) === v.date.slice(0, 7),
        )
      )
        return err(
          f,
          "date",
          t(
            "A subscription entry already exists for this shop and month.",
            "இந்தக் கடைக்கும் மாதத்திற்கும் சந்தா பதிவு ஏற்கெனவே உள்ளது.",
          ),
        );
      upsert(db.subscriptions, numberFields(v, "price"), id, "SUB");
      break;
    case "enquiry-state":
      x = pick(db.enquiries, id);
      if (!x) return;
      x.status = v.status;
      break;
    case "trial":
      upsert(db.trials, numberFields(v, "ph", "ec"), id, "RND");
      break;
    default:
      return;
  }
  actSave();
}
function inventoryMass(batch, except = "") {
  return num(
    db.products
      .filter((x) => x.batch === batch && x.id !== except)
      .reduce(
        (n, p) =>
          n +
          (p.stock +
            sum(
              db.orders.filter((o) => o.product === p.id && o.status === "Delivered"),
              "quantity",
            )) *
            p.bag,
        0,
      ),
  );
}
/* ─── Rendering, storage refresh and delegated interactions ────────────────── */
const publicPages = { home, how, impact, about, contact };
function render() {
  charts.forEach((c) => c.destroy());
  charts = [];
  revealObserver?.disconnect();
  document.documentElement.lang = lang;
  $("#skip").textContent = t("Skip to content", "உள்ளடக்கத்திற்குச் செல்");
  const u = identity(),
    slug = location.hash.slice(1) || "home",
    isDash = slug === "dashboard" && !!u,
    page = Object.hasOwn(publicPages, slug) ? slug : "home";
  if (isDash && !roleTabs(u).some((x) => x[0] === state.tab)) state.tab = "overview";
  $("#app").innerHTML = isDash
    ? dashboard(u)
    : `${header(page)}<main id="main" tabindex="-1">${publicPages[page]()}</main>${footer()}`;
  document.title = isDash
    ? `Pasumai Revive — ${roleTabs(u).find((x) => x[0] === state.tab)[2]}`
    : page === "home"
      ? "Pasumai Revive — Local Waste. New Life."
      : `Pasumai Revive — ${nav().find((x) => x[0] === page)[1]}`;
  if (slug === "dashboard" && !u && !$("#modal").open) loginView();
  if (!isDash && page === "impact") {
    const sr = simCalc(state.sim);
    dayChart(
      "impact-chart",
      accepted(db.collections).filter((r) => r.date >= dateISO(-6)),
    );
    plot(
      "sim-chart",
      "bar",
      Array.from({ length: 6 }, (_, i) => t("Month", "மாதம்") + " " + (i + 1)),
      simSeries(sr),
    );
  }
  if (isDash && u.role === "shop" && state.tab === "history")
    dayChart("shop-month", accepted(visibleRows(u.id)), "month");
  if (isDash && u.role === "admin" && state.tab === "overview") {
    const rows = adminDateRows(),
      a = accepted(rows),
      grades = ["Green", "Amber", "Red"],
      batches = db.batches.filter((x) => x.destination),
      pr = range(db.pickups, state.from, state.to),
      sub = range(db.subscriptions, state.from, state.to);
    dayChart(
      "admin-daily",
      state.from || state.to ? a : a.filter((x) => x.date >= dateISO(-6)),
      "day",
      state.from,
      state.to,
    );
    dayChart("admin-week", a, "week");
    dayChart("admin-month", a, "month");
    plot("admin-grade", "doughnut", grades.map(T), [
      series(
        t("Collected loads", "சேகரிப்பு எண்ணிக்கை"),
        grades.map((g) => rows.filter((x) => x.grade === g).length),
        ["#40916c", "#d9a452", "#b6624e"],
      ),
    ]);
    plot(
      "admin-shops",
      "bar",
      db.shops.map((x) => x.id),
      [
        series(
          t("Accepted kg by shop ID", "கடை எண் வாரியாக ஏற்ற எடை"),
          db.shops.map((x) =>
            sum(
              a.filter((y) => y.shop === x.id),
              "weight",
            ),
          ),
        ),
      ],
    );
    plot(
      "admin-service",
      "bar",
      [T("Completed"), T("Pending"), T("Paid"), t("Unpaid", "செலுத்தவில்லை")],
      [
        series(
          t("Service and billing records", "சேவை, கட்டணப் பதிவுகள்"),
          [
            pr.filter((x) => x.status === "Completed").length,
            pr.filter((x) => x.status !== "Completed").length,
            sub.filter((x) => x.payment === "Paid").length,
            sub.filter((x) => x.payment === "Pending").length,
          ],
          ["#40916c", "#b98765", "#75a38c", "#d5ac8f"],
        ),
      ],
    );
    plot("admin-batches", "bar", stages.map(T), [
      series(
        t("Batch count", "தொகுதி எண்ணிக்கை"),
        stages.map((g) => batches.filter((x) => x.stage === g).length),
      ),
    ]);
  }
  if (
    !matchMedia("(prefers-reduced-motion: reduce)").matches &&
    typeof IntersectionObserver !== "undefined"
  ) {
    const tick = (e) => {
      const end = +e.dataset.counter,
        suf = e.dataset.suffix,
        start = performance.now();
      const run = (time) => {
        if (!e.isConnected) return;
        const f = Math.min(1, (time - start) / 570);
        e.textContent = nf(end * (1 - (1 - f) ** 3)) + suf;
        if (f < 1) requestAnimationFrame(run);
      };
      requestAnimationFrame(run);
    };
    revealObserver = new IntersectionObserver(
      (list) => {
        for (const { target, isIntersecting } of list)
          if (isIntersecting) {
            target.classList.remove("pre");
            if (target.dataset.counter !== undefined) tick(target);
            revealObserver.unobserve(target);
          }
      },
      { threshold: 0.09 },
    );
    $$(".reveal,[data-counter]").forEach((e) => {
      if (e.classList.contains("reveal") && e.getBoundingClientRect().top >= innerHeight)
        e.classList.add("pre");
      revealObserver.observe(e);
    });
  }
}
$("#skip").addEventListener("click", (e) => {
  e.preventDefault();
  $("#main").focus();
  $("#main").scrollIntoView();
});
document.addEventListener("click", (e) => {
  const target = e.target.closest("[data-action]");
  if (target) {
    handleAction(target.dataset.action, target.dataset.arg || "", target);
    return;
  }
  const anchor = e.target.closest('a[href^="#"]');
  if (anchor && anchor.id !== "skip") {
    if ($("#drawer").open) $("#drawer").close();
    closeModal();
    if (location.hash === anchor.hash) {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  }
  if (e.target instanceof HTMLDialogElement) {
    const { top, left, bottom, right } = e.target.getBoundingClientRect();
    if (e.clientX < left || e.clientX > right || e.clientY < top || e.clientY > bottom)
      e.target.close();
  }
});
document.addEventListener("submit", (e) => {
  if (!e.target.matches("form[data-form]")) return;
  e.preventDefault();
  submit(e.target);
});
document.addEventListener("input", (e) => {
  const x = e.target;
  if (x.matches("[aria-invalid=true]")) {
    x.removeAttribute("aria-invalid");
    const err = document.getElementById(x.id + "-error");
    if (err) err.textContent = "";
  }
  if (x.dataset.sim) {
    const k = x.dataset.sim;
    state.sim[k] =
      k === "grade" ? x.value : k === "days" ? Math.min(31, Math.max(1, +x.value || 1)) : +x.value;
    renderSim();
  }
  if (x.name === "shopSearch" && signedFor("admin")) {
    state.query = x.value;
    $("#shop-results").innerHTML = adminShopTable();
  }
  if (x.name === "weight" && x.form?.dataset.form === "collect")
    $("#load-warning").hidden = !(+x.value > config.maxLoad);
  if (x.name === "sources" && x.form?.dataset.form === "batch") {
    const selected = new FormData(x.form).getAll("sources");
    $("#source-total").textContent =
      t("Linked input: ", "இணைத்த உள்ளீடு: ") +
      kg(
        sum(
          db.collections.filter((c) => selected.includes(c.id)),
          "weight",
        ),
      );
  }
});
document.addEventListener("change", (e) => {
  const x = e.target,
    u = identity();
  if (x.name === "shopStatus" && u?.role === "admin") {
    state.shopStatus = x.value;
    $("#shop-results").innerHTML = adminShopTable();
  }
  if (x.dataset.check !== undefined && u?.role === "shop") {
    const k = u.id + "-" + dateISO(),
      item = +x.dataset.check,
      set = new Set(db.checklists[k] || []);
    x.checked ? set.add(item) : set.delete(item);
    db.checklists[k] = [...set];
    save();
  }
  if (x.dataset.sim === "days") x.value = state.sim.days;
});
window.addEventListener("hashchange", () => {
  if ($("#drawer").open) $("#drawer").close();
  render();
  window.scrollTo({ top: 0, behavior: "instant" });
});
window.addEventListener("storage", (e) => {
  if (e.key === key) {
    db = read(local, key, null) || seed();
    if (!identity()) closeModal();
    render();
  }
  if (e.key === key + "-auth" && !read(transient, key + "-auth", null)) {
    session = read(local, key + "-auth", null);
    closeModal();
    state.tab = "overview";
    render();
  }
});
save();
render();
</script>
